[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchat"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "U.N. Owen", email = "void@some.where" },
]

dependencies = [
    "fastapi>=0.115.12",
    "pydantic>=2.10.1",
    "uvicorn>=0.34.0",
    "langchain>=1.0.7",
    "langgraph>=1.0.3",
    "langchain-openai>=1.0.3",
    "langchain-community>=0.4.1",
    "langchain-core>=1.0.5",
    "chromadb",
    "langchain-huggingface>=1.0.1",
    "singleton-decorator",
    "langchain-chroma>=1.0.0",
    "sqlalchemy>=2.0.40",
    "aiosqlite>=0.21.0",
    "langchain-deepseek>=1.0.1",
    "pypdf>=5.4.0",
    "python-multipart>=0.0.20",
    "psycopg2>=2.9.10",
    "pgvector<0.4.0",
    "asyncpg>=0.30.0",
    "langchain-postgres>=0.0.16",
    "apscheduler>=3.11.0",
    "colorlog>=6.9.0",
    "jieba>=0.42.1",
    "jinja2>=3.1.6",
    "torch>=2.9.1",
    "sentence-transformers>=3.0.0",
    "tokenizers>=0.22.0,<0.24.0",
]

[project.urls]
Documentation = "https://github.com/U.N. Owen/langchat#readme"
Issues = "https://github.com/U.N. Owen/langchat/issues"
Source = "https://github.com/U.N. Owen/langchat"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
]

[tool.hatch.version]
path = "src/__about__.py"


[tool.hatch.build.targets.wheel]
packages = ["src"]
